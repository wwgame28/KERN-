<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RumbStory studio</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; background: #14161a; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; justify-items: start; }
  #out { height: min(86vh, 1920px); aspect-ratio: 9 / 16; width: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; width: 480px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1080" height="1920"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="60" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine -->
<script src="src/timing.js"></script>
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/timeline.js"></script>
<!-- the story's library: light, captions, props, places, people -->
<script src="src/lib.js"></script>
<script src="src/props.js"></script>
<script src="src/places.js"></script>
<script src="src/people.js"></script>
<script src="src/sheets.js"></script>
<!-- the five parts; each registers its shots only when ?part matches -->
<script src="src/scenes/p1.js"></script>
<script src="src/scenes/p2.js"></script>
<script src="src/scenes/p3.js"></script>
<script src="src/scenes/p4.js"></script>
<script src="src/scenes/p5.js"></script>
<script>
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
