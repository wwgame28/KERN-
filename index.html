/* ==========================================================================
   MERGE BASTION: EVOLUTION — single-file HTML5 Canvas prototype
   --------------------------------------------------------------------------
   Art direction : flat neon geometry on a deep night-blue field
   Mood          : crisp, energetic, rewarding
   Keywords      : neon · merge · evolve
   Readability   : triangles = danger (enemies), squares/stars = yours (turrets)

   GAME LOOP STRUCTURE
     requestAnimationFrame(frame)
       └─ frame(now): dt = clamp(now - last, 0, 0.25s)  → accumulator
            ├─ while (acc >= STEP) cur.update(STEP)       fixed 60 Hz logic
            │     play.update → simulate(dt):
            │        timers → waves → turrets → bullets(+collisions) → enemies → particles
            └─ cur.render(acc / STEP)                      interpolated drawing
     State machine: menu → welcome → play ⇄ paused / ad / defeat

   File map: CONFIG → PAL/LEVELS → I18N → utils → Save → Yandex SDK & Ads
             → Audio → Canvas/Layout → Pools → World → Systems → UI → States
             → Render → Loop → boot()
   ========================================================================== */

             bossEvery: 10, eliteEvery: 5, retreat: 2 },

  },
  ads:  { freeLevel: 3, rewardCooldown: 30, interstitialGap: 90, interstitialEveryWaves: 10, reviveDmgMult: 2,
          mockRewardTime: 2.5, mockInterTime: 1.2 },

const T = k => I18N[LANG][k] ?? I18N.en[k] ?? k;

/* -------------------------------------------------------------------------- */
/* 4. UTILS                                                                   */
/* -------------------------------------------------------------------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
const REDUCED = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
function angLerp(a, b, t) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return a + d * t;
}
// Seeded RNG so a given wave always has the same composition (reproducible bugs)
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// 12345 → "12.3K"
function fmt(n) {
  n = Math.floor(n);
  if (n < 10000) return String(n);
  const units = ['K', 'M', 'B', 'T', 'Qa', 'Qi'];
  let i = -1;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  return (n < 100 ? n.toFixed(1) : Math.floor(n)) + units[i];
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

// Balance formulas (all driven by CONFIG)
const dmgOf = l => CONFIG.turret.dmgBase * Math.pow(CONFIG.turret.dmgGrowth, l - 1);
const fireIntervalOf = l => CONFIG.turret.fireBase * Math.pow(CONFIG.turret.fireGrowth, l - 1);
const costOf = p => Math.round(CONFIG.economy.baseCost * (1 + CONFIG.economy.costLinear * p));
const hpOf = n => CONFIG.wave.hpBase * Math.pow(n, CONFIG.wave.hpPow) * Math.pow(CONFIG.wave.hpGrowth, n - 1);
const coinOf = n => CONFIG.wave.coinBase * Math.pow(CONFIG.wave.coinGrowth, n - 1);
const waveCount = n => Math.min(CONFIG.wave.countMax, Math.floor(CONFIG.wave.countBase + n * CONFIG.wave.countPerWave));
const spawnInterval = n => Math.max(CONFIG.wave.spawnMin, CONFIG.wave.spawnBase * Math.pow(CONFIG.wave.spawnDecay, n - 1));
const sellValue = l => Math.round(costOf(world.purchases) * CONFIG.economy.sellRate * Math.pow(2, l - 1));

/* -------------------------------------------------------------------------- */
/* 5. SAVE — must never crash if storage is blocked (private mode, iframes)   */
/* -------------------------------------------------------------------------- */
const Store = {
  key: 'mergeBastion.v1',
  get(d) { try { return JSON.parse(localStorage.getItem(this.key)) ?? d; } catch (e) { return d; } },
  set(v) { try { localStorage.setItem(this.key, JSON.stringify(v)); } catch (e) { /* ignore */ } },
};

/* -------------------------------------------------------------------------- */
/* 6. YANDEX GAMES SDK + ADS                                                  */
/*    On Yandex hosting the real SDK (/sdk.js) is loaded; everywhere else the */
/*    same calls fall back to on-screen mocks so the prototype stays playable.*/
/* -------------------------------------------------------------------------- */
let SIM = false;   // true while a headless balance simulation drives the game
const YSDK = {
  sdk: null,
  init() {
    return new Promise(resolve => {
      const onYandex = /yandex|playhop/.test(location.hostname) || /[?&]ysdk\b/.test(location.search);
      if (!onYandex) return resolve(null);
      const s = document.createElement('script');
      s.src = '/sdk.js'; s.async = true;
      s.onload = () => window.YaGames.init().then(sdk => { this.sdk = sdk; resolve(sdk); }).catch(() => resolve(null));
      s.onerror = () => resolve(null);
      document.head.appendChild(s);
      setTimeout(() => resolve(null), 6000);
    });
  },
  ready()         { try { this.sdk?.features?.LoadingAPI?.ready(); } catch (e) { /* noop */ } },
  gameplayStart() { try { this.sdk?.features?.GameplayAPI?.start(); } catch (e) { /* noop */ } },
  gameplayStop()  { try { this.sdk?.features?.GameplayAPI?.stop(); } catch (e) { /* noop */ } },
  lang()          { return this.sdk?.environment?.i18n?.lang; },
};

let adPending = null;   // { kind, t, dur, mock, finish(ok) } — read by the 'ad' state

/** Rewarded video. rewardCallback runs only if the player watched to the end. */
function showRewardedVideo(rewardCallback) {
  openAd('rewarded', ok => { if (ok) rewardCallback(); });
}

/** Fullscreen interstitial (Yandex additionally rate-limits these server-side). */
function showInterstitialAd() {
  world.lastInter = performance.now() / 1000;
  openAd('interstitial', () => {});
}

function openAd(kind, onDone) {
  if (SIM || curName === 'ad') return;
  const back = curName;
  const finish = ok => {
    if (curName !== 'ad') return;
    adPending = null;
    Sfx.duck(false);
    setState(back);
    onDone(ok);
  };
  const dur = kind === 'rewarded' ? CONFIG.ads.mockRewardTime : CONFIG.ads.mockInterTime;
  adPending = { kind, t: 0, dur, mock: !YSDK.sdk, finish };
  setState('ad');                  // pauses the game and stops GameplayAPI
  Sfx.duck(true);                  // Yandex rule: no game audio during ads
  if (!YSDK.sdk) return;           // mock: the 'ad' state counts down and calls finish(true)
  try {
    if (kind === 'rewarded') {
      let rewarded = false;
      YSDK.sdk.adv.showRewardedVideo({ callbacks: {
        onRewarded: () => { rewarded = true; },
        onClose: () => finish(rewarded),
        onError: () => finish(false),
      } });
    } else {
      YSDK.sdk.adv.showFullscreenAdv({ callbacks: {
        onClose: () => finish(true),
        onError: () => finish(false),
        onOffline: () => finish(false),
      } });
    }
  } catch (e) { finish(false); }
}

function maybeInterstitial() {
  if (SIM) return;
  if (performance.now() / 1000 - world.lastInter < CONFIG.ads.interstitialGap) return;
  showInterstitialAd();
}

/* -------------------------------------------------------------------------- */
/* 7. AUDIO — tiny Web Audio synth, no files                                  */
/* -------------------------------------------------------------------------- */
const SFX_GAP = { shoot: 0.07, kill: 0.04, coin: 0.06, hit: 0.05, pick: 0.05 };
const Sfx = {
  ctx: null, out: null, muted: false, ducked: false, last: Object.create(null), noiseBuf: null,
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.out = this.ctx.createGain();
      this.out.connect(this.ctx.destination);
      this.apply();
    }
    if (this.ctx.state === 'suspended' && !document.hidden) this.ctx.resume();
  },
  apply() { if (this.out) this.out.gain.value = this.muted || this.ducked ? 0 : 0.55; },
  setMuted(m) { this.muted = m; this.apply(); },
  duck(d) { this.ducked = d; this.apply(); },
  suspend() { try { this.ctx?.suspend(); } catch (e) { /* noop */ } },
  resume() { try { this.ctx?.resume(); } catch (e) { /* noop */ } },
  tone(freq, dur, type = 'sine', vol = 0.15, slide = 1, delay = 0) {
    const c = this.ctx;
    const t = c.currentTime + delay, f = freq * (0.95 + Math.random() * 0.1);  // ±5% pitch variety
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.out);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol = 0.15, freq = 1200, delay = 0) {
    const c = this.ctx;
    if (!this.noiseBuf) {
      const n = (c.sampleRate * 0.5) | 0;
      this.noiseBuf = c.createBuffer(1, n, c.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(this.out);
    s.start(t); s.stop(t + dur + 0.05);
  },
  play(name, p = 0) {
    if (!this.ctx || this.muted || this.ducked || this.ctx.state !== 'running') return;
    const now = this.ctx.currentTime, gap = SFX_GAP[name] || 0;
    if (gap && now - (this.last[name] || 0) < gap) return;   // throttle spammy sounds
    this.last[name] = now;
    switch (name) {
      case 'shoot': this.tone(900 - p * 40, 0.06, 'square', 0.025, 0.45); break;
      case 'kill':  this.tone(520, 0.09, 'triangle', 0.12, 1.9); this.noise(0.08, 0.06, 3000); break;
      case 'boom':  this.noise(0.5, 0.35, 900); this.tone(90, 0.5, 'sawtooth', 0.15, 0.4); break;
      case 'coin':  this.tone(1320, 0.07, 'sine', 0.05); break;
      case 'buy':   this.tone(620, 0.09, 'square', 0.07, 1.6); break;
      case 'pick':  this.tone(440, 0.05, 'sine', 0.08, 1.3); break;
      case 'drop':  this.tone(330, 0.06, 'sine', 0.08, 0.8); break;
      case 'merge':
        [523, 659, 784, 1047].forEach((f, i) => this.tone(f * (1 + p * 0.06), 0.14, 'triangle', 0.13, 1, i * 0.055));
        break;
      case 'unlock':
        [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.22, 'square', 0.07, 1, i * 0.08));
        break;
      case 'hurt':  this.tone(140, 0.28, 'sawtooth', 0.18, 0.5); this.noise(0.2, 0.18, 700); break;
      case 'error': this.tone(170, 0.13, 'square', 0.07, 0.8); break;
      case 'wave':  this.tone(392, 0.16, 'triangle', 0.12); this.tone(587, 0.22, 'triangle', 0.12, 1, 0.12); break;
      case 'click': this.tone(1000, 0.035, 'sine', 0.05); break;
      case 'lose':  [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.12, 1, i * 0.13)); break;
    }
  },
};

/* -------------------------------------------------------------------------- */
/* 8. CANVAS & RESPONSIVE LAYOUT                                              */
/*    Logical width is fixed (540). Logical height stretches with the screen  */
/*    aspect (960…1170) so tall phones get a taller battlefield, then the     */
/*    whole thing is uniformly scaled + letterboxed. Enemy speed is measured  */
/*    in "field heights per second", so difficulty is identical everywhere.   */
/* -------------------------------------------------------------------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const bgCanvas = document.createElement('canvas');   // static background, drawn once per resize
const bgCtx = bgCanvas.getContext('2d');
const L = { W: CONFIG.W, H: CONFIG.H_MIN, scale: 1, offX: 0, offY: 0, dpr: 1 };

function readSafeArea() {
  const cs = getComputedStyle(document.getElementById('safe'));
  return { top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0 };
}

function layout() {
  const C = CONFIG, vw = window.innerWidth, vh = window.innerHeight;
  L.H = Math.round(clamp(C.W * vh / vw, C.H_MIN, C.H_MAX));
  L.scale = Math.min(vw / L.W, vh / L.H);
  L.offX = (vw - L.W * L.scale) / 2;
  L.offY = (vh - L.H * L.scale) / 2;
  L.dpr = Math.min(window.devicePixelRatio || 1, C.DPR_MAX);
  canvas.width = Math.round(vw * L.dpr);
  canvas.height = Math.round(vh * L.dpr);

  // Safe-area insets only matter when the game reaches the physical screen edge
  const sa = readSafeArea();
  const safeTop = Math.max(0, sa.top - L.offY) / L.scale;
  const safeBot = Math.max(0, sa.bottom - L.offY) / L.scale;

  L.hudY = 10 + safeTop;
  const btnH = 72;
  L.btnY = L.H - btnH - 14 - safeBot;
  L.buyBtn = { x: 14, y: L.btnY, w: 304, h: btnH };
  L.adBtn = { x: 330, y: L.btnY, w: 196, h: btnH };
  L.soundBtn = { x: L.W - 108, y: L.hudY, w: 44, h: 44 };
  L.pauseBtn = { x: L.W - 56, y: L.hudY, w: 44, h: 44 };
  L.coinIcon = { x: 36, y: L.hudY + 22 };

  const s = C.cell, g = C.gap, rowW = C.cols * s + (C.cols - 1) * g, x0 = (L.W - rowW) / 2;
  L.gridY = L.btnY - 18 - (C.gridRows * s + (C.gridRows - 1) * g);
  L.defY = L.gridY - 44 - s;
  L.baseY = L.defY - 22;                    // the wall: enemies touching it hurt the bastion
  L.fieldTop = L.hudY + 54;
  L.fieldH = L.baseY - L.fieldTop;
  L.panelDef = { x: x0 - 10, y: L.defY - 10, w: rowW + 20, h: s + 20 };
  L.panelGrid = { x: x0 - 10, y: L.gridY - 10, w: rowW + 20, h: C.gridRows * s + (C.gridRows - 1) * g + 20 };

  // Cell geometry: indices 0..cols-1 are the DEFENSE row, the rest is the MERGE grid
  world.cells.forEach((c, i) => {
    const col = i % C.cols, row = Math.floor(i / C.cols);
    c.x = x0 + col * (s + g) + s / 2;
    c.y = row === 0 ? L.defY + s / 2 : L.gridY + (row - 1) * (s + g) + s / 2;
    c.s = s;
  });
  rebuildBg();
}

/** Screen → logical coordinates */
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left - L.offX) / L.scale, y: (e.clientY - r.top - L.offY) / L.scale, touch: e.pointerType !== 'mouse' };
}
const setUI = () => {
  const k = L.dpr * L.scale;
  ctx.setTransform(k, 0, 0, k, L.offX * L.dpr, L.offY * L.dpr);
};

/* -------------------------------------------------------------------------- */
/* 9. OBJECT POOLS — no garbage per frame for bullets/particles/enemies       */
/* -------------------------------------------------------------------------- */
function makePool(n, factory) {
  const items = Array.from({ length: n }, factory);
  let cursor = 0;
  return {
    items,
    spawn() {
      for (let k = 0; k < n; k++) {
        const it = items[cursor];
        cursor = (cursor + 1) % n;
        if (!it.alive) { it.alive = true; return it; }
      }
      return null;               // pool exhausted: skip this effect
    },
    clear() { for (const it of items) it.alive = false; },
  };
}
const enemies = makePool(CONFIG.pools.enemies, () => ({ alive: false, type: 'grunt', x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, r: 10, hp: 1, maxHp: 1, speed: 0, coin: 1, dmg: 1, flash: 0, wob: 0, wobS: 1, drift: 0 }));
const bullets = makePool(CONFIG.pools.bullets, () => ({ alive: false, x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, r: 4, dmg: 1, lvl: 1, splash: 0, life: 0 }));
const parts = makePool(CONFIG.pools.particles, () => ({ alive: false, kind: 0, x: 0, y: 0, vx: 0, vy: 0, x0: 0, y0: 0, life: 0, max: 1, size: 2, r1: 0, color: '#fff' }));
const floats = makePool(CONFIG.pools.floats, () => ({ alive: false, x: 0, y: 0, text: '', color: '#fff', size: 18, life: 0, max: 1 }));

/* -------------------------------------------------------------------------- */
/* 10. WORLD STATE                                                            */
/* -------------------------------------------------------------------------- */
const world = { cells: [] };
let drag = null;            // { from, lvl, x, y, touch, hover, overSell }
let pendingIdle = 0;        // offline earnings waiting to be collected

function newWorld() {
  Object.assign(world, {
    coins: CONFIG.economy.startCoins, purchases: 0, wave: 1, best: 1, maxLvl: 1,
    baseHp: CONFIG.base.hp, phase: 'idle', phaseT: 0, queue: [], qi: 0, spawnT: 0, rng: Math.random,
    waveTotal: 0, waveDone: 0, alive: 0, time: 0, adCd: 0, tutorial: 0, tutT: 0,
    shakeT: 0, shakeDur: 0.2, shakeMag: 0, hitstop: 0, hurt: 0, coinPulse: 0, buyWiggle: 0,
    banner: null, unlock: null, toast: null, saveT: 0, dirty: false, rage: false,
    lastInter: world.lastInter ?? -1e9, debug: false, fps: 60,
  });
  const n = CONFIG.cols * (CONFIG.gridRows + 1);
  world.cells = Array.from({ length: n }, () => ({ lvl: 0, cd: 0, ang: -Math.PI / 2, recoil: 0, pop: 0, x: 0, y: 0, s: CONFIG.cell }));
  enemies.clear(); bullets.clear(); parts.clear(); floats.clear();
}

function saveGame() {
  if (SIM) return;
  world.dirty = false;
  Store.set({
    v: 1, wave: world.wave, coins: world.coins, purchases: world.purchases, best: world.best,
    maxLvl: world.maxLvl, tut: world.tutorial, cells: world.cells.map(c => c.lvl), muted: Sfx.muted, t: Date.now(),
  });
}

function loadGame() {
  newWorld();
  const s = Store.get(null);
  if (!s || s.v !== 1) return;
  Object.assign(world, { wave: s.wave | 0 || 1, coins: +s.coins || 0, purchases: s.purchases | 0, best: s.best | 0 || 1, maxLvl: s.maxLvl | 0 || 1, tutorial: s.tut | 0 });
  (s.cells || []).forEach((l, i) => { if (world.cells[i]) world.cells[i].lvl = clamp(l | 0, 0, CONFIG.maxLevel); });
  Sfx.muted = !!s.muted;
  if (world.cells.some(c => c.lvl)) { world.phase = 'break'; world.phaseT = 1.5; }
  // Idle reward: the bastion keeps "earning" while the player is away
  const away = (Date.now() - (s.t || Date.now())) / 1000;
  if (away >= CONFIG.idle.minAway && world.cells.some(c => c.lvl)) {
    const perSec = CONFIG.idle.rate * coinOf(world.wave) * waveCount(world.wave) / 30;
    pendingIdle = Math.floor(Math.min(away, CONFIG.idle.maxAway) * perSec);
  }
}

/* -------------------------------------------------------------------------- */
/* 11. SYSTEMS                                                                */
/* -------------------------------------------------------------------------- */
const hasDefense = () => world.cells.some((c, i) => i < CONFIG.cols && c.lvl > 0);

function findFreeCell() {
  // New turrets go to an empty DEFENSE slot first (so they fight immediately), then the grid
  for (let i = 0; i < world.cells.length; i++) if (!world.cells[i].lvl) return i;
  return -1;
}

function cellAt(p) {
  const half = CONFIG.cell / 2 + CONFIG.gap / 2;
  for (let i = 0; i < world.cells.length; i++) {
    const c = world.cells[i];
    if (Math.abs(p.x - c.x) <= half && Math.abs(p.y - c.y) <= half) return i;
  }
  return -1;
}

function shake(mag, dur = 0.22) {
  if (REDUCED || mag < world.shakeMag * (world.shakeT / world.shakeDur)) return;
  world.shakeMag = mag; world.shakeT = world.shakeDur = dur;
}
function toast(text) { world.toast = { text, t: 0 }; }
function banner(text, color, sub) { world.banner = { text, color, sub, t: 0, dur: 1.8 }; }

/* ---- particles & floating text ---- */
function burst(x, y, color, n, speed, size, life) {
  for (let i = 0; i < n; i++) {
    const p = parts.spawn(); if (!p) return;
    const a = Math.random() * TAU, v = speed * (0.35 + Math.random() * 0.65);
    p.kind = 0; p.x = x; p.y = y; p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v;
    p.life = p.max = life * (0.6 + Math.random() * 0.4); p.size = size * (0.6 + Math.random() * 0.6); p.color = color;
  }
}
function ring(x, y, color, r1, life, width = 4) {
  const p = parts.spawn(); if (!p) return;
  p.kind = 1; p.x = x; p.y = y; p.r1 = r1; p.life = p.max = life; p.size = width; p.color = color;
}
function coinFly(x, y, n) {
  for (let i = 0; i < n; i++) {
    const p = parts.spawn(); if (!p) return;
    p.kind = 2; p.x0 = x + (Math.random() - 0.5) * 20; p.y0 = y + (Math.random() - 0.5) * 20; p.x = p.x0; p.y = p.y0;
    p.life = p.max = 0.55 + Math.random() * 0.25 + i * 0.05; p.size = 7; p.color = PAL.coin;
  }
}
function floatText(x, y, text, color, size = 20) {
  const f = floats.spawn(); if (!f) return;
  f.x = x; f.y = y; f.text = text; f.color = color; f.size = size; f.life = f.max = 0.9;
}

function updateParticles(dt) {
  for (const p of parts.items) {
    if (!p.alive) continue;
    p.life -= dt;
    if (p.kind === 2) {                       // coin flying to the HUD counter
      const t = 1 - p.life / p.max, e = t * t * t;
      p.x = lerp(p.x0, L.coinIcon.x, e) + Math.sin(t * Math.PI) * 30;
      p.y = lerp(p.y0, L.coinIcon.y, e);
      if (p.life <= 0) { world.coinPulse = 1; Sfx.play('coin'); }
    } else if (p.kind === 0) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      const fr = Math.exp(-4 * dt); p.vx *= fr; p.vy *= fr;
    }
    if (p.life <= 0) p.alive = false;
  }
  for (const f of floats.items) {
    if (!f.alive) continue;
    f.life -= dt; f.y -= 38 * dt;
    if (f.life <= 0) f.alive = false;
  }
}

/* ---- economy: buy / sell / merge ---- */
function placeTurret(idx, lvl) {
  const c = world.cells[idx];
  c.lvl = lvl; c.pop = 1; c.cd = 0.25; c.ang = -Math.PI / 2;
  burst(c.x, c.y, LEVELS[lvl - 1].color, 14, 220, 4, 0.45);
  ring(c.x, c.y, LEVELS[lvl - 1].color, 60, 0.35, 3);
  registerLevel(lvl);
  world.dirty = true;
}

function buyTurret() {
  const idx = findFreeCell();
  if (idx < 0) { toast(T('noSpace')); Sfx.play('error'); world.buyWiggle = 0.3; return false; }
  const cost = costOf(world.purchases);
  if (world.coins < cost) { toast(T('noCoins')); Sfx.play('error'); world.buyWiggle = 0.3; return false; }
  world.coins -= cost;
  world.purchases++;
  placeTurret(idx, 1);
  Sfx.play('buy');
  return true;
}

function sellTurret(idx) {
  const c = world.cells[idx], v = sellValue(c.lvl);
  world.coins += v;
  burst(c.x, c.y, PAL.coin, 16, 240, 4, 0.5);
  floatText(L.buyBtn.x + L.buyBtn.w / 2, L.buyBtn.y - 10, '+' + fmt(v), PAL.coin, 24);
  c.lvl = 0; world.dirty = true;
  Sfx.play('coin');
}

/** Drop the turret from cell `from` onto cell `to`: move, merge or swap. */
function tryDrop(from, to) {
  const a = world.cells[from], b = world.cells[to];
  if (from === to || !a.lvl) return 'none';
  world.dirty = true;
  if (!b.lvl) {
    b.lvl = a.lvl; b.cd = a.cd; b.pop = 0.6; a.lvl = 0;
    return 'move';
  }
  if (b.lvl === a.lvl && a.lvl < CONFIG.maxLevel) {
    b.lvl++; b.pop = 1; b.cd = 0.15; a.lvl = 0;
    const col = LEVELS[b.lvl - 1].color;
    burst(b.x, b.y, col, 26, 320, 5, 0.6);
    ring(b.x, b.y, col, 90, 0.45, 5);
    ring(b.x, b.y, '#ffffff', 55, 0.3, 2);
    floatText(b.x, b.y - 46, `${T('lvl')} ${b.lvl}`, col, 22);
    shake(3, 0.12);
    Sfx.play('merge', b.lvl);
    registerLevel(b.lvl);
    if (world.tutorial === 1) { world.tutorial = 2; world.tutT = 0; }
    return 'merge';
  }
  if (b.lvl === a.lvl) toast(T('maxed'));
  const l = a.lvl; a.lvl = b.lvl; b.lvl = l; a.pop = b.pop = 0.5;
  return 'swap';
}

/** First time a level is created → "NEW TURRET!" card (collection hook) */
function registerLevel(l) {
  if (l <= world.maxLvl) return;
  world.maxLvl = l;
  world.unlock = { lvl: l, t: 0 };
  Sfx.play('unlock');
}

function adFreeTurret() {
  if (findFreeCell() < 0) { toast(T('noSpace')); Sfx.play('error'); return; }
  showRewardedVideo(() => {
    const i = findFreeCell();
    if (i < 0) return;
    placeTurret(i, CONFIG.ads.freeLevel);
    world.adCd = CONFIG.ads.rewardCooldown;
    Sfx.play('merge', 2);
    saveGame();
  });
}

/* ---- waves ---- */
function buildWave(n, rng) {
  const W = CONFIG.wave, q = [];
  const boss = n % W.bossEvery === 0, elite = !boss && n % W.eliteEvery === 0;
  const count = boss ? Math.ceil(waveCount(n) * 0.5) : waveCount(n);
  for (let i = 0; i < count; i++) {
    let type = 'grunt';
    const r = rng();
    if (n >= 5 && r < 0.14) type = 'brute';
    else if (n >= 3 && r < 0.4) type = 'runner';
    q.push(type);
  }
  if (boss) q.splice(Math.floor(q.length / 3), 0, 'boss');
  if (elite) q.push('brute', 'brute');
  return q;
}

function startWave() {
  const w = world, n = w.wave;
  w.rng = mulberry32(n * 7919 + 13);
  w.queue = buildWave(n, w.rng);
  w.qi = 0; w.spawnT = 0.4; w.phase = 'spawn';
  w.baseHp = CONFIG.base.hp;
  w.waveTotal = w.queue.length; w.waveDone = 0;
  if (n % CONFIG.wave.bossEvery === 0) banner(T('boss'), PAL.danger, `${T('wave')} ${n}`);
  else if (n % CONFIG.wave.eliteEvery === 0) banner(`${T('wave')} ${n}`, ENEMY_COL.brute, T('elite'));
  else banner(`${T('wave')} ${n}`, PAL.text);
  Sfx.play('wave');
}

function spawnEnemy(type) {
  const e = enemies.spawn(); if (!e) return;
  const d = CONFIG.enemies[type], w = world;
  e.type = type; e.r = d.r;
  e.maxHp = e.hp = hpOf(w.wave) * d.hp;
  e.speed = d.speed; e.dmg = d.dmg;
  e.coin = Math.max(1, Math.round(coinOf(w.wave) * d.coin));
  e.x = e.px = 30 + d.r + w.rng() * (L.W - 60 - d.r * 2);
  e.y = e.py = L.fieldTop - d.r;
  e.wob = w.rng() * TAU; e.wobS = 1 + w.rng() * 1.5; e.drift = type === 'boss' ? 12 : 18 + w.rng() * 22;
  e.flash = 0; e.vx = 0; e.vy = 0;
  w.alive++;
  if (type === 'boss') { w.spawnT += 1.5; shake(5, 0.4); }
}

function waveCleared() {
  const w = world;
  const bonus = Math.round(coinOf(w.wave) * CONFIG.economy.waveBonus);
  w.coins += bonus;
  floatText(L.W / 2, L.fieldTop + L.fieldH * 0.45, `${T('cleared')}  +${fmt(bonus)}`, PAL.good, 26);
  coinFly(L.W / 2, L.fieldTop + L.fieldH * 0.45, 6);
  w.wave++;
  w.best = Math.max(w.best, w.wave);
  w.rage = false;
  w.phase = 'break'; w.phaseT = CONFIG.wave.breakTime;
  saveGame();
  if ((w.wave - 1) % CONFIG.ads.interstitialEveryWaves === 0) maybeInterstitial();
}

function updateWave(dt) {
  const w = world;
  switch (w.phase) {
    case 'idle':                // tutorial: the first wave waits for the first turret
      if (hasDefense()) { w.phase = 'break'; w.phaseT = 1.0; }
      break;
    case 'break':
      w.phaseT -= dt;
      if (w.phaseT <= 0) startWave();
      break;
    case 'spawn':
      w.spawnT -= dt;
      while (w.spawnT <= 0 && w.qi < w.queue.length) {
        spawnEnemy(w.queue[w.qi++]);
        w.spawnT += spawnInterval(w.wave);
      }
      if (w.qi >= w.queue.length) w.phase = 'fight';
      break;
    case 'fight':
      if (w.alive <= 0) waveCleared();
      break;
  }
}

/* ---- turrets ---- */
function nearestEnemy(x, y) {
  let best = null, bd = Infinity;
  for (const e of enemies.items) {
    if (!e.alive || e.y < L.fieldTop - e.r * 0.5) continue;   // only visible targets
    const d = (e.x - x) * (e.x - x) + (e.y - y) * (e.y - y);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function updateTurrets(dt) {
  const spd = CONFIG.turret.bulletSpeed;
  for (let i = 0; i < world.cells.length; i++) {
    const c = world.cells[i];
    if (c.pop > 0) c.pop = Math.max(0, c.pop - dt * 2.8);
    if (c.recoil > 0) c.recoil = Math.max(0, c.recoil - dt * 7);
    if (i >= CONFIG.cols || !c.lvl || (drag && drag.from === i)) continue;   // only the defense row fires
    c.cd = Math.max(0, c.cd - dt);
    const e = nearestEnemy(c.x, c.y);
    if (!e) { c.ang = angLerp(c.ang, -Math.PI / 2, Math.min(1, dt * 4)); continue; }
    // Lead the target: aim where it will be when the bullet arrives
    const t = Math.hypot(e.x - c.x, e.y - c.y) / spd;
    const a = Math.atan2(e.y + e.vy * t - c.y, e.x + e.vx * t - c.x);
    c.ang = angLerp(c.ang, a, Math.min(1, dt * CONFIG.turret.turnRate));
    if (c.cd <= 0) { fire(c, a); c.cd = fireIntervalOf(c.lvl); }
  }
}

function fire(c, a) {
  const b = bullets.spawn(); if (!b) return;
  const muzzle = c.s * 0.42;
  b.x = b.px = c.x + Math.cos(a) * muzzle;
  b.y = b.py = c.y + Math.sin(a) * muzzle;
  b.vx = Math.cos(a) * CONFIG.turret.bulletSpeed;
  b.vy = Math.sin(a) * CONFIG.turret.bulletSpeed;
  b.lvl = c.lvl; b.r = 3.5 + c.lvl * 0.7; b.life = 1.5;
  b.dmg = dmgOf(c.lvl) * (world.rage ? CONFIG.ads.reviveDmgMult : 1);
  b.splash = c.lvl >= CONFIG.turret.splashFrom ? 26 + c.lvl * 4 : 0;
  c.recoil = 1;
  burst(b.x, b.y, LEVELS[c.lvl - 1].color, 2, 90, 2.5, 0.12);   // muzzle flash
  Sfx.play('shoot', c.lvl);
}

/* ---- bullets & collision (circle vs circle) ---- */
function updateBullets(dt) {
  for (const b of bullets.items) {
    if (!b.alive) continue;
    b.px = b.x; b.py = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.y < L.fieldTop - 50 || b.y > L.H || b.x < -20 || b.x > L.W + 20) { b.alive = false; continue; }
    for (const e of enemies.items) {
      if (!e.alive) continue;
      const rr = e.r + b.r, dx = e.x - b.x, dy = e.y - b.y;
      if (dx * dx + dy * dy <= rr * rr) {
        hitEnemy(e, b.dmg, true);
        if (b.splash) splashDamage(b.x, b.y, b.splash, b.dmg * CONFIG.turret.splashFrac, e, LEVELS[b.lvl - 1].color);
        b.alive = false;
        break;
      }
    }
  }
}

function splashDamage(x, y, radius, dmg, skip, color) {
  ring(x, y, color, radius, 0.25, 3);
  for (const e of enemies.items) {
    if (!e.alive || e === skip) continue;
    const rr = radius + e.r;
    if ((e.x - x) * (e.x - x) + (e.y - y) * (e.y - y) <= rr * rr) hitEnemy(e, dmg, false);
  }
}

function hitEnemy(e, dmg, sparks) {
  if (!e.alive) return;
  e.hp -= dmg; e.flash = 0.08;
  if (sparks) burst(e.x, e.y + e.r * 0.3, '#ffffff', 3, 160, 2.5, 0.18);
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  const w = world, col = ENEMY_COL[e.type], big = e.type === 'boss';
  e.alive = false; w.alive--; w.waveDone++;
  w.coins += e.coin;
  burst(e.x, e.y, col, big ? 60 : 10 + e.r * 0.6, big ? 420 : 260, big ? 7 : 4, big ? 0.9 : 0.5);
  ring(e.x, e.y, col, e.r * 2.4, 0.3, big ? 6 : 3);
  floatText(e.x, e.y - e.r, '+' + fmt(e.coin), PAL.coin, big ? 30 : 18);
  coinFly(e.x, e.y, big ? 8 : 1);
  if (big) { shake(12, 0.45); w.hitstop = 0.09; Sfx.play('boom'); }
  else { if (e.type === 'brute') shake(3, 0.12); Sfx.play('kill'); }
}

function breach(e) {
  const w = world;
  e.alive = false; w.alive--; w.waveDone++;
  w.baseHp -= e.dmg;
  w.hurt = 0.4;
  shake(e.type === 'boss' ? 14 : 7, 0.3);
  burst(e.x, L.baseY, PAL.danger, 22, 300, 5, 0.6);
  floatText(e.x, L.baseY - 24, '-' + e.dmg, PAL.danger, 24);
  Sfx.play('hurt');
  if (w.baseHp <= 0) defeat();
}

function updateEnemies(dt) {
  const fh = L.fieldH;
  for (const e of enemies.items) {
    if (!e.alive) continue;
    e.px = e.x; e.py = e.y;
    e.wob += dt * e.wobS;
    e.vx = Math.sin(e.wob) * e.drift;
    e.vy = e.speed * fh;
    e.x = clamp(e.x + e.vx * dt, 20 + e.r, L.W - 20 - e.r);
    e.y += e.vy * dt;
    if (e.flash > 0) e.flash -= dt;
    if (e.y + e.r * 0.6 >= L.baseY) {
      breach(e);
      if (world.phase === 'lost') return;
    }
  }
}

function clearField() {
  enemies.clear(); bullets.clear();
  world.alive = 0;
}

function defeat() {
  world.phase = 'lost';
  world.rage = false;
  Sfx.play('lose');
  saveGame();
  setState('defeat');
}

/** Reward-ad revive: replay the same wave with a full wall and doubled damage,
 *  so watching the ad really changes the outcome */
function revive() {
  clearField();
  startWave();
  world.rage = true;
  banner(T('rage'), PAL.danger, `${T('wave')} ${world.wave}`);
  setState('play');
}

/** Free option: fall back a few waves to farm coins; turrets are kept */
function retreat(withAd = true) {
  clearField();
  world.wave = Math.max(1, world.wave - CONFIG.wave.retreat);
  world.phase = 'break'; world.phaseT = 1.5;
  world.baseHp = CONFIG.base.hp;
  world.waveTotal = world.waveDone = 0;
  saveGame();
  setState('play');
  if (withAd) maybeInterstitial();
}

function updateTutorial(dt) {
  const w = world;
  if (w.tutorial === 0 && world.cells.some(c => c.lvl)) w.tutorial = 1;
  if (w.tutorial === 2) { w.tutT += dt; if (w.tutT > 4.5) { w.tutorial = 3; w.dirty = true; } }
}

/** One fixed step of the whole game world */
function simulate(dt) {
  const w = world;
  w.time += dt;
  if (w.shakeT > 0) w.shakeT -= dt;
  if (w.hurt > 0) w.hurt -= dt;
  if (w.coinPulse > 0) w.coinPulse = Math.max(0, w.coinPulse - dt * 4);
  if (w.buyWiggle > 0) w.buyWiggle -= dt;
  if (w.adCd > 0) w.adCd -= dt;
  if (w.banner && (w.banner.t += dt) > w.banner.dur) w.banner = null;
  if (w.unlock && (w.unlock.t += dt) > 2.8) w.unlock = null;
  if (w.toast && (w.toast.t += dt) > 1.6) w.toast = null;
  updateTutorial(dt);
  if (w.hitstop > 0) { w.hitstop -= dt; updateParticles(dt * 0.25); return; }   // freeze-frame on big kills
  updateWave(dt);
  updateTurrets(dt);
  updateBullets(dt);
  updateEnemies(dt);
  updateParticles(dt);
  if ((w.saveT += dt) > CONFIG.autosave) { w.saveT = 0; if (w.dirty) saveGame(); }
}

/* -------------------------------------------------------------------------- */
/* 12. UI BUTTONS (canvas-drawn, hit-tested in logical space)                 */
/* -------------------------------------------------------------------------- */
let pressedBtn = null;
function button(rect, onTap, enabled = () => true) { return { rect, onTap, enabled, pressed: false }; }
function uiDown(list, p) {
  for (const b of list) {
    if (!inRect(p, b.rect())) continue;
    if (b.enabled()) { pressedBtn = b; b.pressed = true; } else Sfx.play('error');
    return true;
  }
  return false;
}
function uiUp(p) {
  if (!pressedBtn) return false;
  const b = pressedBtn;
  pressedBtn = null; b.pressed = false;
  if (inRect(p, b.rect())) { Sfx.play('click'); b.onTap(); }
  return true;
}

const BTN = {
  sound: button(() => L.soundBtn, () => { Sfx.setMuted(!Sfx.muted); saveGame(); }),
  pause: button(() => L.pauseBtn, () => setState('paused')),
  buy:   button(() => L.buyBtn, buyTurret),
  ad:    button(() => L.adBtn, adFreeTurret, () => world.adCd <= 0),
};

/* -------------------------------------------------------------------------- */
/* 13. STATE MACHINE                                                          */
/* -------------------------------------------------------------------------- */
let cur = null, curName = '';
function setState(name) {
  if (curName === name) return;
  cur?.exit?.();
  cur = States[name]; curName = name;
  cur.enter?.();
}

// Shared behaviour of modal screens with buttons
function modal(def) {
  return Object.assign({
    t: 0, btns: [],
    update(dt) { this.t += dt; world.time += dt; updateParticles(dt); },
    down(p) { uiDown(this.btns, p); },
    up(p) { uiUp(p); },
  }, def);
}

const States = {
  menu: {
    t: 0,
    enter() { this.t = 0; },
    update(dt) { this.t += dt; world.time += dt; updateParticles(dt); },
    render(a) { renderWorld(a); setUI(); drawHUD(false); drawMenu(this.t); },
    down(p) {
      Sfx.unlock();
      if (uiDown([BTN.sound], p)) return;
      Sfx.play('click');
      setState(pendingIdle > 0 ? 'welcome' : 'play');
    },
    up(p) { uiUp(p); },
    key(e) { if (e.code === 'Space' || e.code === 'Enter') this.down({ x: -1, y: -1 }); },
  },

  welcome: modal({
    enter() {
      this.t = 0;
      const r = (dy) => () => ({ x: L.W / 2 - 170, y: L.H * 0.44 + dy, w: 340, h: 70 });
      const take = mult => { world.coins += pendingIdle * mult; coinFly(L.W / 2, L.H * 0.4, 10); pendingIdle = 0; saveGame(); setState('play'); };
      this.btns = [
        Object.assign(button(r(40), () => showRewardedVideo(() => take(CONFIG.idle.adMult))), { label: T('triple'), ad: true, col: [PAL.good, '#1f9e6a'] }),
        Object.assign(button(r(126), () => take(1)), { label: T('collect'), col: [PAL.surface2, '#151a40'] }),
      ];
    },
    render(a) {
      renderWorld(a); setUI(); drawHUD(false); dim(0.72);
      const cy = L.H * 0.4;
      drawPanel(L.W / 2 - 210, cy - 150, 420, 400);
      txt(ctx, T('welcomeT'), L.W / 2, cy - 105, 34, PAL.primary, { weight: 900, stroke: 6, maxW: 380 });
      txt(ctx, T('welcomeS'), L.W / 2, cy - 64, 17, PAL.muted, { maxW: 380, weight: 700 });
      coinIcon(ctx, L.W / 2 - 70, cy - 10, 20);
      txt(ctx, '+' + fmt(pendingIdle), L.W / 2 - 40, cy - 8, 40, PAL.text, { align: 'left', weight: 900 });
      this.btns.forEach(b => drawModalBtn(b));
    },
  }),

  play: {
    enter() { YSDK.gameplayStart(); },
    exit() { YSDK.gameplayStop(); drag = null; if (pressedBtn) { pressedBtn.pressed = false; pressedBtn = null; } },
    update(dt) { simulate(dt); },
    render(a) { renderWorld(a); setUI(); drawHUD(true); drawButtons(); drawPlayOverlay(); },
    down(p) {
      Sfx.unlock();
      if (uiDown([BTN.sound, BTN.pause, BTN.buy, BTN.ad], p)) return;
      const i = cellAt(p);
      if (i >= 0 && world.cells[i].lvl) {
        drag = { from: i, lvl: world.cells[i].lvl, x: p.x, y: p.y, touch: p.touch, hover: -1, overSell: false };
        Sfx.play('pick');
      }
    },
    move(p) {
      if (!drag) return;
      drag.x = p.x; drag.y = p.y;
      const g = dragPos();
      drag.hover = cellAt(g);
      drag.overSell = inRect(g, L.buyBtn);
    },
    up(p) {
      if (uiUp(p)) return;
      if (!drag) return;
      this.move(p);
      const from = drag.from, to = drag.hover, sell = drag.overSell;
      drag = null;
      if (to >= 0 && to !== from) { if (tryDrop(from, to) !== 'merge') Sfx.play('drop'); }
      else if (sell) sellTurret(from);
      else world.cells[from].pop = 0.4;      // snap back
    },
    key(e) {
      if (e.code === 'KeyB') buyTurret();
      else if (e.code === 'KeyM') BTN.sound.onTap();
      else if (e.code === 'Space' || e.code === 'KeyP' || e.code === 'Escape') setState('paused');
    },
  },

  paused: {
    enter() { saveGame(); },
    update() {},
    render(a) {
      renderWorld(a); setUI(); drawHUD(false); drawButtons(); dim(0.65);
      txt(ctx, T('paused'), L.W / 2, L.H * 0.42, 54, PAL.text, { weight: 900, stroke: 7 });
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 250);
      txt(ctx, T('resume'), L.W / 2, L.H * 0.42 + 56, 22, PAL.muted, { weight: 700 });
      ctx.globalAlpha = 1;
    },
    down(p) { Sfx.unlock(); if (uiDown([BTN.sound], p)) return; this.go = true; },
    up(p) { if (uiUp(p)) return; if (this.go) { this.go = false; setState('play'); } },
    key(e) { if (e.code === 'Space' || e.code === 'KeyP' || e.code === 'Escape') setState('play'); },
  },

  ad: {
    update(dt) {
      if (!adPending) return;
      adPending.t += dt;
      if (adPending.mock && adPending.t >= adPending.dur) adPending.finish(true);

    render(a) {
      renderWorld(a); setUI(); dim(0.9);

        txt(ctx, `${adPending.kind} · ${T('adMock')}`, L.W / 2, L.H * 0.42 + 40, 15, PAL.muted, { weight: 600, maxW: 480 });
        const k = clamp(adPending.t / adPending.dur, 0, 1);
        ctx.fillStyle = PAL.surface2; rr(ctx, L.W / 2 - 150, L.H * 0.42 + 70, 300, 10, 5); ctx.fill();
        ctx.fillStyle = PAL.primary; rr(ctx, L.W / 2 - 150, L.H * 0.42 + 70, 300 * k, 10, 5); ctx.fill();
        txt(ctx, Math.ceil(adPending.dur - adPending.t) + 's', L.W / 2, L.H * 0.42 + 106, 20, PAL.text);
      }
    },
  },

  defeat: modal({
    enter() {
      this.t = 0;
      const r = (dy) => () => ({ x: L.W / 2 - 180, y: L.H * 0.42 + dy, w: 360, h: 74 });
      const back = Math.max(1, world.wave - CONFIG.wave.retreat);
      this.btns = [
        Object.assign(button(r(10), () => showRewardedVideo(revive)), { label: T('revive'), ad: true, col: [PAL.good, '#1f9e6a'] }),
        Object.assign(button(r(100), () => retreat(true)), { label: `${T('retreat')} ${back}`, col: [PAL.surface2, '#151a40'] }),
      ];
    },
    render(a) {
      renderWorld(a); setUI(); drawHUD(false); dim(0.7);
      const cy = L.H * 0.42, s = easeOutBack(clamp(this.t / 0.35, 0, 1));
      ctx.save(); ctx.translate(L.W / 2, cy - 90); ctx.scale(s, s);
      txt(ctx, T('lostT'), 0, 0, 38, PAL.danger, { weight: 900, stroke: 7, maxW: 480 });
      ctx.restore();
      txt(ctx, T('lostS'), L.W / 2, cy - 44, 19, PAL.muted, { weight: 700 });
      this.btns.forEach(b => drawModalBtn(b));
    },
  }),
};

/* -------------------------------------------------------------------------- */
/* 14. RENDERING                                                              */
/* -------------------------------------------------------------------------- */
const FONT = '"Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

function rr(g, x, y, w, h, r) {        // rounded rect path (no reliance on ctx.roundRect)
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function poly(g, n, r, inner, rot) {    // regular polygon, or star when inner < 1
  const pts = inner < 1 ? n * 2 : n;
  g.beginPath();
  for (let i = 0; i < pts; i++) {
    const a = rot + (i * TAU) / pts, rad = inner < 1 && i % 2 ? r * inner : r;
    if (i) g.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); else g.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  g.closePath();
}
function txt(g, s, x, y, size, color, o = {}) {
  const weight = o.weight || 800;
  g.font = `${weight} ${size}px ${FONT}`;
  if (o.maxW) {
    const w = g.measureText(s).width;
    if (w > o.maxW) g.font = `${weight} ${Math.max(8, (size * o.maxW) / w)}px ${FONT}`;
  }
  g.textAlign = o.align || 'center';
  g.textBaseline = 'middle';
  if (o.stroke) { g.lineJoin = 'round'; g.lineWidth = o.stroke; g.strokeStyle = 'rgba(5,6,20,0.9)'; g.strokeText(s, x, y); }
  g.fillStyle = color;
  g.fillText(s, x, y);
}
function coinIcon(g, x, y, r) {
  g.fillStyle = PAL.coin; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  g.strokeStyle = '#c98a00'; g.lineWidth = r * 0.22; g.beginPath(); g.arc(x, y, r * 0.58, 0, TAU); g.stroke();
}
function dim(a) { ctx.fillStyle = `rgba(5,6,20,${a})`; ctx.fillRect(0, 0, L.W, L.H); }

// Cached soft glow sprites per colour (cheap replacement for shadowBlur)
const glowCache = new Map();
function glowSprite(color) {
  let c = glowCache.get(color);
  if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, hexA(color, 0.9)); grd.addColorStop(0.35, hexA(color, 0.3)); grd.addColorStop(1, hexA(color, 0));
  g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  glowCache.set(color, c);
  return c;
}
function glow(x, y, r, color, a) {
  const prev = ctx.globalAlpha;
  ctx.globalAlpha = prev * a;
  ctx.drawImage(glowSprite(color), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = prev;
}

/** Turret: plate + rotating barrels + evolving core shape + level badge */
function drawTurret(x, y, s, lvl, ang, recoil, t, alpha, active) {
  const def = LEVELS[lvl - 1], col = def.color;
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = 'lighter';
  glow(0, 0, s * (0.55 + lvl * 0.025), col, active ? 0.6 : 0.3);
  ctx.globalCompositeOperation = 'source-over';
  rr(ctx, -s * 0.38, -s * 0.38, s * 0.76, s * 0.76, s * 0.18);
  ctx.fillStyle = PAL.plate; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.stroke();
  // barrels (1 → 2 → 3 as the turret evolves)
  ctx.save();
  ctx.rotate(ang + Math.PI / 2);
  const nb = lvl >= 8 ? 3 : lvl >= 4 ? 2 : 1, bw = s * (0.08 + lvl * 0.004), bl = s * (0.36 + lvl * 0.012), back = recoil * s * 0.08;
  ctx.fillStyle = col;
  for (let i = 0; i < nb; i++) {
    const ox = (i - (nb - 1) / 2) * bw * 1.5;
    rr(ctx, ox - bw / 2, -bl + back, bw, bl * 0.8, bw * 0.4); ctx.fill();
  }
  ctx.restore();
  // core
  const cr = s * (0.17 + lvl * 0.007);
  ctx.save();
  ctx.rotate(t * (0.5 + lvl * 0.12) * (lvl % 2 ? 1 : -1));
  poly(ctx, def.sides, cr, def.inner, -Math.PI / 2 + (def.sides === 4 && def.inner === 1 ? Math.PI / 4 : 0));
  ctx.fillStyle = col; ctx.fill();
  poly(ctx, def.sides, cr * 0.45, def.inner, -Math.PI / 2);
  ctx.fillStyle = PAL.plate; ctx.fill();
  ctx.restore();
  // orbiting sparks for high tiers
  if (lvl >= 7) {
    ctx.fillStyle = '#ffffff';
    const n = lvl - 6;
    for (let k = 0; k < n; k++) {
      const a = t * 2.2 + (k * TAU) / n;
      ctx.beginPath(); ctx.arc(Math.cos(a) * s * 0.3, Math.sin(a) * s * 0.3, s * 0.03, 0, TAU); ctx.fill();
    }
  }
  // level badge
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(s * 0.3, s * 0.3, s * 0.13, 0, TAU); ctx.fill();
  txt(ctx, String(lvl), s * 0.3, s * 0.305, s * 0.16, PAL.plate, { weight: 900 });
  ctx.restore();
}

function drawEnemy(e, x, y) {
  const r = e.r, col = ENEMY_COL[e.type];
  ctx.globalCompositeOperation = 'lighter';
  glow(x, y, r * 2.3, col, 0.45);
  ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.sin(e.wob * 1.3) * 0.12);
  const wf = e.type === 'runner' ? 0.62 : 0.95;
  if (e.type === 'boss') {                   // side spikes
    ctx.fillStyle = col;
    for (const sx of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(sx * r * 0.7, -r * 0.4); ctx.lineTo(sx * r * 1.35, -r * 0.95); ctx.lineTo(sx * r * 0.95, -r * 0.1); ctx.fill();
    }
  }
  ctx.beginPath(); ctx.moveTo(0, r); ctx.lineTo(-r * wf, -r * 0.75); ctx.lineTo(r * wf, -r * 0.75); ctx.closePath();
  ctx.fillStyle = e.flash > 0 ? '#ffffff' : col; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, r * 0.15); ctx.lineTo(-r * 0.32 * wf, -r * 0.4); ctx.lineTo(r * 0.32 * wf, -r * 0.4); ctx.closePath();
  ctx.fillStyle = PAL.plate; ctx.fill();
  ctx.restore();
  if (e.hp < e.maxHp && e.type !== 'boss') {
    const w = r * 2, k = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - w / 2, y - r - 10, w, 4);
    ctx.fillStyle = k > 0.5 ? PAL.good : k > 0.25 ? PAL.primary : PAL.danger; ctx.fillRect(x - w / 2, y - r - 10, w * k, 4);
  }
}

/** Static background cached in an offscreen canvas (redrawn only on resize) */
function rebuildBg() {
  bgCanvas.width = canvas.width; bgCanvas.height = canvas.height;
  const g = bgCtx, k = L.dpr * L.scale;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#05060f'; g.fillRect(0, 0, bgCanvas.width, bgCanvas.height);   // letterbox
  g.setTransform(k, 0, 0, k, L.offX * L.dpr, L.offY * L.dpr);
  const grd = g.createLinearGradient(0, 0, 0, L.H);
  grd.addColorStop(0, '#11143a'); grd.addColorStop(0.45, PAL.bg); grd.addColorStop(1, '#080a18');
  g.fillStyle = grd; g.fillRect(0, 0, L.W, L.H);
  g.strokeStyle = 'rgba(76,201,240,0.07)'; g.lineWidth = 1;
  g.beginPath();
  for (let x = 0; x <= L.W; x += 45) { g.moveTo(x + 0.5, L.fieldTop); g.lineTo(x + 0.5, L.baseY); }
  for (let y = L.baseY; y >= L.fieldTop; y -= 45) { g.moveTo(0, y + 0.5); g.lineTo(L.W, y + 0.5); }
  g.stroke();
  const r = mulberry32(42);
  for (let i = 0; i < 70; i++) {
    g.fillStyle = `rgba(255,255,255,${0.08 + r() * 0.3})`;
    g.fillRect(r() * L.W, L.fieldTop + r() * L.fieldH, 1.6, 1.6);
  }
  const panel = (p, fill, stroke) => { rr(g, p.x, p.y, p.w, p.h, 20); g.fillStyle = fill; g.fill(); g.lineWidth = 2; g.strokeStyle = stroke; g.stroke(); };
  panel(L.panelDef, 'rgba(76,201,240,0.08)', 'rgba(76,201,240,0.45)');
  panel(L.panelGrid, 'rgba(23,27,61,0.85)', 'rgba(138,143,199,0.22)');
  g.setLineDash([6, 6]);
  world.cells.forEach((c, i) => {
    rr(g, c.x - c.s / 2 + 3, c.y - c.s / 2 + 3, c.s - 6, c.s - 6, 16);
    g.fillStyle = i < CONFIG.cols ? 'rgba(76,201,240,0.06)' : 'rgba(255,255,255,0.03)'; g.fill();
    g.strokeStyle = i < CONFIG.cols ? 'rgba(76,201,240,0.3)' : 'rgba(138,143,199,0.22)'; g.lineWidth = 1.5; g.stroke();
  });
  g.setLineDash([]);
  txt(g, T('merge'), L.W / 2, L.gridY - 22, 13, PAL.muted, { weight: 800 });
}

function drawWall() {
  const y = L.baseY, k = clamp(world.baseHp / CONFIG.base.hp, 0, 1);
  const col = k > 0.5 ? PAL.accent : k > 0.25 ? PAL.primary : PAL.danger;
  ctx.fillStyle = hexA(col, 0.16); ctx.fillRect(0, y, L.W, 10);
  ctx.fillStyle = hexA(col, 0.55);
  for (let x = 6; x < L.W; x += 36) ctx.fillRect(x, y - 6, 18, 6);   // battlements
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = col; ctx.fillRect(0, y, L.W, 2);
  ctx.globalCompositeOperation = 'source-over';
  const n = CONFIG.base.hp, pw = 14, gap = 4, x0 = L.W / 2 - (n * (pw + gap) - gap) / 2;   // HP pips
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = i < world.baseHp ? col : 'rgba(255,255,255,0.12)';
    ctx.fillRect(x0 + i * (pw + gap), y + 3, pw, 5);
  }
}

function drawCells() {
  const t = world.time, max = CONFIG.maxLevel;
  for (let i = 0; i < world.cells.length; i++) {
    const c = world.cells[i];
    if (drag && i !== drag.from) {           // drop-target hints while dragging
      const same = c.lvl === drag.lvl && c.lvl < max;
      if (i === drag.hover || same) {
        const pulse = 0.5 + 0.5 * Math.sin(t * 8);
        rr(ctx, c.x - c.s / 2 + 2, c.y - c.s / 2 + 2, c.s - 4, c.s - 4, 16);
        ctx.lineWidth = i === drag.hover ? 4 : 2.5;
        ctx.strokeStyle = same ? hexA(PAL.good, i === drag.hover ? 1 : 0.4 + 0.4 * pulse) : 'rgba(255,255,255,0.7)';
        ctx.stroke();
        if (same && i === drag.hover) { ctx.globalCompositeOperation = 'lighter'; glow(c.x, c.y, c.s * 0.9, PAL.good, 0.5); ctx.globalCompositeOperation = 'source-over'; }
      }
    }
    if (!c.lvl || (drag && drag.from === i)) continue;
    const s = c.s * (1 + Math.sin(c.pop * Math.PI) * 0.28);
    drawTurret(c.x, c.y, s, c.lvl, i < CONFIG.cols ? c.ang : -Math.PI / 2, c.recoil, t, 1, i < CONFIG.cols);
  }
}

function drawParticles(coinsOnly) {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts.items) {
    if (!p.alive || (p.kind === 2) !== coinsOnly) continue;
    const k = p.life / p.max;
    if (p.kind === 0) {
      ctx.globalAlpha = k; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + k * 0.6), 0, TAU); ctx.fill();
    } else if (p.kind === 1) {
      ctx.globalAlpha = k; ctx.strokeStyle = p.color; ctx.lineWidth = p.size * k + 0.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r1 * easeOutCubic(1 - k) + 2, 0, TAU); ctx.stroke();
    } else {
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      coinIcon(ctx, p.x, p.y, p.size);
      ctx.globalCompositeOperation = 'lighter';
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/** Everything that lives "in the world" (shakes with the camera) */
function renderWorld(alpha) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bgCanvas, 0, 0);
  const k = L.dpr * L.scale;
  let sx = 0, sy = 0;
  if (world.shakeT > 0) {
    const m = world.shakeMag * (world.shakeT / world.shakeDur);
    sx = (Math.random() * 2 - 1) * m; sy = (Math.random() * 2 - 1) * m;
  }
  ctx.setTransform(k, 0, 0, k, (L.offX + sx * L.scale) * L.dpr, (L.offY + sy * L.scale) * L.dpr);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, L.W, L.H); ctx.clip();

  if (world.hurt > 0) {                         // red flash rising from the wall
    const g = ctx.createLinearGradient(0, L.baseY, 0, L.baseY - 220);
    g.addColorStop(0, `rgba(255,77,109,${0.45 * world.hurt / 0.4})`); g.addColorStop(1, 'rgba(255,77,109,0)');
    ctx.fillStyle = g; ctx.fillRect(0, L.baseY - 220, L.W, 220);
  }
  drawWall();
  let boss = null;
  for (const e of enemies.items) {
    if (!e.alive) continue;
    drawEnemy(e, lerp(e.px, e.x, alpha), lerp(e.py, e.y, alpha));
    if (e.type === 'boss') boss = e;
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bullets.items) {
    if (!b.alive) continue;
    const x = lerp(b.px, b.x, alpha), y = lerp(b.py, b.y, alpha), col = LEVELS[b.lvl - 1].color;
    ctx.strokeStyle = col; ctx.lineWidth = b.r * 1.1; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(x - b.vx * 0.025, y - b.vy * 0.025); ctx.lineTo(x, y); ctx.stroke();
    ctx.globalAlpha = 1;
    glow(x, y, b.r * 3.2, col, 0.8);
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x, y, b.r * 0.65, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  drawParticles(false);
  drawCells();
  for (const f of floats.items) {
    if (!f.alive) continue;
    ctx.globalAlpha = Math.min(1, f.life / f.max * 2);
    txt(ctx, f.text, f.x, f.y, f.size, f.color, { weight: 900, stroke: 4 });
  }
  ctx.globalAlpha = 1;
  if (boss) {                                    // big boss bar under the HUD
    const w = L.W - 60, k2 = Math.max(0, boss.hp / boss.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; rr(ctx, 30, L.fieldTop + 4, w, 10, 5); ctx.fill();
    ctx.fillStyle = PAL.danger; rr(ctx, 30, L.fieldTop + 4, w * k2, 10, 5); ctx.fill();
  }
  ctx.restore();
}

function iconBtn(b, draw) {
  const r = b.rect(), s = b.pressed ? 0.92 : 1;
  ctx.save();
  ctx.translate(r.x + r.w / 2, r.y + r.h / 2); ctx.scale(s, s);
  rr(ctx, -r.w / 2, -r.h / 2, r.w, r.h, 14);
  ctx.fillStyle = 'rgba(8,10,28,0.75)'; ctx.fill();
  ctx.strokeStyle = 'rgba(138,143,199,0.35)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = PAL.text; ctx.strokeStyle = PAL.text;
  draw();
  ctx.restore();
}

function drawHUD(showPause) {
  const y = L.hudY;
  rr(ctx, 12, y, 162, 44, 22); ctx.fillStyle = 'rgba(8,10,28,0.75)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,210,63,0.35)'; ctx.lineWidth = 2; ctx.stroke();
  coinIcon(ctx, L.coinIcon.x, L.coinIcon.y, 13 * (1 + world.coinPulse * 0.3));
  txt(ctx, fmt(world.coins), 58, y + 23, 24, PAL.text, { align: 'left', weight: 900, maxW: 108 });

  const boss = world.wave % CONFIG.wave.bossEvery === 0;
  rr(ctx, L.W / 2 - 82, y, 164, 44, 22); ctx.fillStyle = 'rgba(8,10,28,0.75)'; ctx.fill();
  ctx.strokeStyle = boss ? hexA(PAL.danger, 0.6) : 'rgba(76,201,240,0.35)'; ctx.stroke();
  txt(ctx, `${T('wave')} ${world.wave}`, L.W / 2, y + 18, 19, boss ? PAL.danger : PAL.text, { weight: 900, maxW: 140 });
  const k = world.waveTotal ? world.waveDone / world.waveTotal : 0;
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; rr(ctx, L.W / 2 - 60, y + 32, 120, 5, 2.5); ctx.fill();
  ctx.fillStyle = boss ? PAL.danger : PAL.accent; rr(ctx, L.W / 2 - 60, y + 32, 120 * k, 5, 2.5); ctx.fill();
  if (world.rage) {
    const a = 0.75 + 0.25 * Math.sin(world.time * 8);
    rr(ctx, L.W / 2 - 50, y + 50, 100, 24, 12); ctx.fillStyle = hexA(PAL.danger, a); ctx.fill();
    txt(ctx, T('rage'), L.W / 2, y + 63, 14, '#fff', { weight: 900 });
  }

  iconBtn(BTN.sound, () => {
    ctx.beginPath(); ctx.moveTo(-11, -5); ctx.lineTo(-5, -5); ctx.lineTo(2, -11); ctx.lineTo(2, 11); ctx.lineTo(-5, 5); ctx.lineTo(-11, 5); ctx.closePath(); ctx.fill();
    ctx.lineWidth = 2.5;
    if (Sfx.muted) { ctx.strokeStyle = PAL.danger; ctx.beginPath(); ctx.moveTo(6, -6); ctx.lineTo(14, 6); ctx.moveTo(14, -6); ctx.lineTo(6, 6); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(3, 0, 7, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(3, 0, 12, -0.9, 0.9); ctx.stroke(); }
  });
  if (showPause) iconBtn(BTN.pause, () => { ctx.fillRect(-8, -10, 6, 20); ctx.fillRect(3, -10, 6, 20); });
}

/** Chunky 3D-ish button; `content` draws inside the same press-scale transform */
function bigButton(r, top, bottom, pressed, content) {
  const s = pressed ? 0.95 : 1, cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
  rr(ctx, r.x, r.y + 5, r.w, r.h, 20); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
  const g = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  rr(ctx, r.x, r.y, r.w, r.h, 20); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.stroke();
  content();
  ctx.restore();
}

function adBadge(x, y) {
  rr(ctx, x - 24, y - 11, 48, 22, 11); ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.fillStyle = '#7b2ff7';
  ctx.beginPath(); ctx.moveTo(x - 15, y - 6); ctx.lineTo(x - 15, y + 6); ctx.lineTo(x - 6, y); ctx.closePath(); ctx.fill();
  txt(ctx, 'AD', x + 7, y + 1, 13, '#7b2ff7', { weight: 900 });
}

function drawButtons() {
  const b = L.buyBtn, cost = costOf(world.purchases), free = findFreeCell() >= 0, t = world.time;
  if (drag) {                                    // while dragging, BUY becomes a SELL drop zone
    const over = drag.overSell;
    bigButton(b, over ? '#ff8095' : '#ff4d6d', '#a3122f', over, () => {
      txt(ctx, T('sell'), b.x + 100, b.y + b.h / 2, 28, '#fff', { weight: 900, maxW: 150 });
      coinIcon(ctx, b.x + 200, b.y + b.h / 2, 13);
      txt(ctx, '+' + fmt(sellValue(drag.lvl)), b.x + 218, b.y + b.h / 2 + 1, 24, '#fff', { align: 'left', weight: 900, maxW: 74 });
    });
  } else {
    const ok = free && world.coins >= cost;
    const wig = world.buyWiggle > 0 ? Math.sin(world.buyWiggle * 60) * 6 * world.buyWiggle / 0.3 : 0;
    ctx.save(); ctx.translate(wig, 0);
    bigButton(b, ok ? '#ffe066' : '#3a3f73', ok ? '#f59f00' : '#262a58', BTN.buy.pressed, () => {
      drawTurret(b.x + 42, b.y + b.h / 2, 54, 1, -Math.PI / 2, 0, t, ok ? 1 : 0.5, false);
      const ink = ok ? '#2b1d00' : PAL.muted;
      txt(ctx, free ? T('buy') : T('full'), b.x + 138, b.y + b.h / 2 + 1, 28, ink, { weight: 900, maxW: 120 });
      rr(ctx, b.x + 204, b.y + 18, 88, 36, 18); ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill();
      coinIcon(ctx, b.x + 222, b.y + b.h / 2, 11);
      txt(ctx, fmt(cost), b.x + 238, b.y + b.h / 2 + 1, 20, ok ? '#fff' : PAL.muted, { align: 'left', weight: 900, maxW: 50 });
    });
    ctx.restore();
    // tutorial: pulsing ring around BUY
    if (world.tutorial < 3 && ok && !hasMergePair() && curName === 'play') {
      const k = (t * 1.2) % 1;
      rr(ctx, b.x - 6 - k * 10, b.y - 6 - k * 10, b.w + 12 + k * 20, b.h + 12 + k * 20, 24 + k * 8);
      ctx.strokeStyle = hexA(PAL.primary, 1 - k); ctx.lineWidth = 3; ctx.stroke();
    }
  }
  const a = L.adBtn, cd = world.adCd > 0;
  bigButton(a, cd ? '#3a3f73' : '#9d4edd', cd ? '#262a58' : '#5a189a', BTN.ad.pressed, () => {
    if (cd) {
      txt(ctx, Math.ceil(world.adCd) + 's', a.x + a.w / 2, a.y + a.h / 2, 26, PAL.muted, { weight: 900 });
    } else {
      txt(ctx, T('ad1'), a.x + a.w / 2, a.y + 26, 19, '#fff', { weight: 900, maxW: a.w - 20 });
      txt(ctx, T('ad2'), a.x + a.w / 2, a.y + 50, 15, '#e9d5ff', { weight: 800, maxW: a.w - 20 });
    }
  });
  if (!cd) adBadge(a.x + a.w - 26, a.y - 2);
}

function hasMergePair() {
  const seen = new Set();
  for (const c of world.cells) {
    if (!c.lvl || c.lvl >= CONFIG.maxLevel) continue;
    if (seen.has(c.lvl)) return true;
    seen.add(c.lvl);
  }
  return false;
}
function findMergePair() {
  for (let i = 0; i < world.cells.length; i++) {
    const l = world.cells[i].lvl;
    if (!l || l >= CONFIG.maxLevel) continue;
    for (let j = i + 1; j < world.cells.length; j++) if (world.cells[j].lvl === l) return [j, i];
  }
  return null;
}

const dragPos = () => ({ x: drag.x, y: drag.y - (drag.touch ? 34 : 0) });   // lift above the finger

function hintPill(text) {
  ctx.font = `800 17px ${FONT}`;
  const w = Math.min(L.W - 40, ctx.measureText(text).width + 40), y = L.baseY - 44;
  rr(ctx, L.W / 2 - w / 2, y - 19, w, 38, 19); ctx.fillStyle = 'rgba(8,10,28,0.85)'; ctx.fill();
  ctx.strokeStyle = hexA(PAL.primary, 0.6); ctx.lineWidth = 2; ctx.stroke();
  txt(ctx, text, L.W / 2, y + 1, 17, PAL.primary, { weight: 800, maxW: w - 24 });
}

function drawPlayOverlay() {
  const w = world, t = w.time;
  // tutorial
  if (w.tutorial < 3 && !drag) {
    const pair = w.tutorial >= 1 ? findMergePair() : null;
    if (w.tutorial === 2) hintPill(T('hintFire'));
    else if (pair) {
      hintPill(T('hintMerge'));
      const a = w.cells[pair[0]], b = w.cells[pair[1]], k = easeOutCubic((t * 0.8) % 1);
      drawTurret(lerp(a.x, b.x, k), lerp(a.y, b.y, k), a.s, a.lvl, -Math.PI / 2, 0, t, 0.45, false);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(lerp(a.x, b.x, k) + 14, lerp(a.y, b.y, k) + 18, 12, 0, TAU); ctx.fill();
    } else hintPill(T('hintBuy'));
  }
  // banner
  if (w.banner) {
    const b = w.banner, a = b.t < 0.3 ? b.t / 0.3 : b.t > b.dur - 0.4 ? (b.dur - b.t) / 0.4 : 1;
    ctx.save();
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.translate(L.W / 2, L.fieldTop + L.fieldH * 0.28);
    const s = easeOutBack(clamp(b.t / 0.35, 0, 1)); ctx.scale(s, s);
    txt(ctx, b.text, 0, 0, 50, b.color, { weight: 900, stroke: 8, maxW: 480 });
    if (b.sub) txt(ctx, b.sub, 0, 42, 20, PAL.muted, { weight: 800, stroke: 4 });
    ctx.restore();
  }
  // "NEW TURRET!" evolution card
  if (w.unlock) {
    const u = w.unlock, a = u.t < 0.25 ? u.t / 0.25 : u.t > 2.4 ? (2.8 - u.t) / 0.4 : 1;
    const cx = L.W / 2, cy = L.fieldTop + L.fieldH * 0.55, col = LEVELS[u.lvl - 1].color;
    ctx.save();
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.globalCompositeOperation = 'lighter';
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 0.6);
    ctx.fillStyle = hexA(col, 0.12);
    for (let i = 0; i < 12; i++) { ctx.rotate(TAU / 12); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-18, -170); ctx.lineTo(18, -170); ctx.fill(); }
    ctx.restore();
    glow(cx, cy, 130, col, 0.5);
    ctx.globalCompositeOperation = 'source-over';
    rr(ctx, cx - 150, cy - 100, 300, 200, 22); ctx.fillStyle = 'rgba(15,18,48,0.92)'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
    txt(ctx, T('newT'), cx, cy - 72, 26, PAL.primary, { weight: 900, stroke: 5 });
    drawTurret(cx, cy - 2, 92 * easeOutBack(clamp(u.t / 0.45, 0, 1)), u.lvl, -Math.PI / 2, 0, t, 1, true);
    txt(ctx, `${T('lvl')} ${u.lvl} · ${T('names')[u.lvl - 1]}`, cx, cy + 58, 21, col, { weight: 900, maxW: 270 });
    txt(ctx, `${T('dmg')} ${fmt(dmgOf(u.lvl))}`, cx, cy + 82, 15, PAL.muted, { weight: 800 });
    ctx.restore();
  }
  // toast
  if (w.toast) {
    ctx.globalAlpha = clamp((1.6 - w.toast.t) / 0.3, 0, 1);
    txt(ctx, w.toast.text, L.W / 2, L.btnY - 20, 18, PAL.danger, { weight: 900, stroke: 5 });
    ctx.globalAlpha = 1;
  }
  // dragged turret (on top of everything) + info label
  if (drag) {
    const g = dragPos(), tgt = drag.hover >= 0 ? w.cells[drag.hover] : null;
    const merging = tgt && drag.hover !== drag.from && tgt.lvl === drag.lvl && drag.lvl < CONFIG.maxLevel;
    drawTurret(g.x, g.y, CONFIG.cell * 1.1, drag.lvl, -Math.PI / 2, 0, t, 0.92, true);
    const label = merging ? `→ ${T('lvl')} ${drag.lvl + 1} · ${T('names')[drag.lvl]}` : `${T('lvl')} ${drag.lvl} · ${T('names')[drag.lvl - 1]}`;
    txt(ctx, label, clamp(g.x, 110, L.W - 110), g.y - 64, 17, merging ? PAL.good : PAL.text, { weight: 900, stroke: 4, maxW: 210 });
  }
  setUI();
  drawParticles(true);                          // coins flying into the HUD counter
  if (w.debug) {
    let ne = 0, nb = 0, np = 0;
    enemies.items.forEach(e => { ne += e.alive; }); bullets.items.forEach(b => { nb += b.alive; }); parts.items.forEach(p => { np += p.alive; });
    txt(ctx, `FPS ${w.fps | 0}  E${ne} B${nb} P${np}  H${L.H}`, 14, L.fieldTop + 24, 13, PAL.good, { align: 'left', weight: 700, stroke: 3 });
  }
}

function drawPanel(x, y, w, h) {
  rr(ctx, x, y + 6, w, h, 26); ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
  rr(ctx, x, y, w, h, 26); ctx.fillStyle = PAL.surface; ctx.fill();
  ctx.strokeStyle = hexA(PAL.accent, 0.4); ctx.lineWidth = 2; ctx.stroke();
}
function drawModalBtn(b) {
  const r = b.rect();
  bigButton(r, b.col[0], b.col[1], b.pressed, () => {
    txt(ctx, b.label, r.x + r.w / 2, r.y + r.h / 2 + 1, 24, '#fff', { weight: 900, maxW: r.w - 90, stroke: 3 });
  });
  if (b.ad) adBadge(r.x + r.w - 30, r.y - 2);
}

function drawMenu(t) {
  dim(0.72);
  const cy = L.H * 0.27;
  ctx.globalCompositeOperation = 'lighter';
  glow(L.W / 2, cy, 260, PAL.accent, 0.3);
  ctx.globalCompositeOperation = 'source-over';
  txt(ctx, T('title1'), L.W / 2, cy - 22, 58, PAL.text, { weight: 900, stroke: 8, maxW: 500 });
  txt(ctx, T('title2'), L.W / 2, cy + 34, 32, PAL.primary, { weight: 900, stroke: 6 });
  const n = 5, sp = 98, x0 = L.W / 2 - ((n - 1) * sp) / 2, y = cy + 150;   // evolution chain teaser
  for (let i = 0; i < n; i++) {
    drawTurret(x0 + i * sp, y + Math.sin(t * 2.4 + i * 0.8) * 6, 72, i + 1, -Math.PI / 2, 0, t, 1, true);
    if (i < n - 1) txt(ctx, '›', x0 + i * sp + sp / 2, y, 30, PAL.muted, { weight: 900 });
  }
  const py = L.panelGrid.y + L.panelGrid.h / 2, ps = 1 + Math.sin(t * 4) * 0.035;
  ctx.save(); ctx.translate(L.W / 2, py); ctx.scale(ps, ps);
  rr(ctx, -200, -40, 400, 80, 40); ctx.fillStyle = PAL.primary; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 3; ctx.stroke();
  txt(ctx, '▶  ' + T('tap'), 0, 2, 28, '#2b1d00', { weight: 900, maxW: 360 });
  ctx.restore();
  if (world.best > 1) txt(ctx, `${T('best')} ${world.best}`, L.W / 2, py + 72, 20, PAL.muted, { weight: 800, stroke: 4 });
}

/* -------------------------------------------------------------------------- */
/* 15. INPUT — one pointer layer for mouse + touch + pen, plus keyboard       */
/* -------------------------------------------------------------------------- */
let activePointer = null;
canvas.addEventListener('pointerdown', e => {
  if (activePointer !== null) return;            // ignore extra fingers
  activePointer = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
  canvas.focus();
  cur?.down?.(toLogical(e));
});
canvas.addEventListener('pointermove', e => { if (e.pointerId === activePointer) cur?.move?.(toLogical(e)); });
const endPointer = e => {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  cur?.up?.(toLogical(e));
};
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
window.addEventListener('keydown', e => {
  if (e.code === 'Backquote') { world.debug = !world.debug; return; }
  cur?.key?.(e);
});
// Yandex Games requirements: no context menu, no text selection, no pinch zoom
['contextmenu', 'selectstart', 'gesturestart', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));
// Pause + mute when the tab is hidden (also a Yandex requirement)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (curName === 'play') setState('paused');
    saveGame();
    Sfx.suspend();
  } else Sfx.resume();
});
window.addEventListener('pagehide', saveGame);

/* -------------------------------------------------------------------------- */
/* 16. MAIN LOOP — fixed timestep with accumulator + render interpolation     */
/* -------------------------------------------------------------------------- */
let last = performance.now(), acc = 0, fpsT = 0, fpsN = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, CONFIG.MAX_FRAME);   // clamp: tab switches, hiccups
  last = now;
  acc += dt;
  while (acc >= CONFIG.STEP) { cur.update(CONFIG.STEP); acc -= CONFIG.STEP; }
  cur.render(acc / CONFIG.STEP);
  fpsN++; fpsT += dt;
  if (fpsT >= 0.5) { world.fps = fpsN / fpsT; fpsN = 0; fpsT = 0; }
  requestAnimationFrame(frame);
}

/* -------------------------------------------------------------------------- */
/* 17. BOOT                                                                   */
/* -------------------------------------------------------------------------- */
function boot() {
  LANG = pickLang();
  document.documentElement.lang = LANG;
  loadGame();
  layout();
  setState('menu');
  requestAnimationFrame(t => { last = t; frame(t); });
  // The SDK loads in parallel; the menu is already interactive
  YSDK.init().then(sdk => {
    if (sdk) { LANG = pickLang(YSDK.lang()); document.documentElement.lang = LANG; rebuildBg(); }
    YSDK.ready();   // LoadingAPI.ready(): tells Yandex the game is playable
  });
}
boot();
</script>
